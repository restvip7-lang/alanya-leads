# Облачный запуск парсера: 08:00, 13:00 и 17:00 по Турции (UTC+3), каждый день, ночью не работает. Заявки уходят в кабинет Асель (webhook),
# кабинет сам пропускает повторы. Настройка: README → «Запуск в облаке».
name: Сбор заявок

on:
  schedule:
    - cron: "0 5,10,14 * * *"   # UTC: 05:00, 10:00, 14:00 = 08:00, 13:00, 17:00 в Турции
  workflow_dispatch:
    inputs:
      hours:
        description: "За сколько часов собрать"
        default: "16"

concurrency:
  group: parse
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Собрать заявки
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          HOURS: ${{ github.event.inputs.hours || '16' }}
        # Окно 16 часов: утренний запуск захватывает всю ночь (17:00 → 08:00 = 15 ч) с запасом.
        # Перекрытия не страшны: кабинет сам отбрасывает повторы, уведомление только о новых.
        run: |
          if [ -z "$TG_SESSION" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "::notice::Секреты TG_SESSION / WEBHOOK_SECRET ещё не заданы, пропускаю запуск. См. README."
            exit 0
          fi
          python parser.py --config config.example.ini --hours "$HOURS"
