# Облачный запуск парсера: 07:53, 12:53 и 16:53 по Турции (UTC+3), каждый день, ночью не работает. Заявки уходят в кабинет Асель (webhook),
# кабинет сам пропускает повторы. Настройка: README → «Запуск в облаке».
name: Сбор заявок

on:
  schedule:
    # Не ровно в :00: в начале часа GitHub перегружен и задерживает или пропускает запуски
    - cron: "52 4,9,13 * * *"   # UTC: 04:53, 09:53, 13:53 = 07:53, 12:53, 16:53 в Турции
  workflow_dispatch:
    inputs:
      hours:
        description: "За сколько часов собрать"
        default: "16"

concurrency:
  group: parse
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Собрать заявки
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          HOURS: ${{ github.event.inputs.hours || '16' }}
        # Окно 16 часов: утренний запуск захватывает всю ночь (17:00 → 08:00 = 15 ч) с запасом.
        # Перекрытия не страшны: кабинет сам отбрасывает повторы, уведомление только о новых.
        run: |
          if [ -z "$TG_SESSION" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "::notice::Секреты TG_SESSION / WEBHOOK_SECRET ещё не заданы, пропускаю запуск. См. README."
            exit 0
          fi
          python parser.py --config config.example.ini --hours "$HOURS"
      # Отдельный парсер: квартиры на продажу от собственников. Идёт после заявок, той же сессией Telegram
      # (две одновременные сессии Telegram может разлогинить). Если он упадёт, заявки покупателей уже отправлены.
      - name: Квартиры от собственников
        if: always()
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          HOURS: ${{ github.event.inputs.hours || '16' }}
        run: |
          if [ -z "$TG_SESSION" ] || [ -z "$WEBHOOK_SECRET" ]; then exit 0; fi
          python owners.py --config config.example.ini --hours "$HOURS"
