[telegram]
; Получить на https://my.telegram.org -> API development tools
api_id = 1234567
api_hash = 0123456789abcdef0123456789abcdef

[sources]
; По одному чату на строку: @username, ссылка t.me/... или точное название.
; Ваш аккаунт должен состоять в этих чатах.
chats =
    @example_alanya_chat
    https://t.me/example_alanya_realty
; За сколько последних дней собирать при запуске
days = 3

[output]
; leads.csv удобно хранить в git, leads.xlsx удобно открывать в Excel
file = data/leads.csv
